services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cspm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cspm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cspm"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://cspm:${POSTGRES_PASSWORD}@db:5432/cspm
      CSPM_API_KEY: ${CSPM_API_KEY:-}
      # For real AWS scans pass read-only credentials (prefer an IAM role in production):
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports: ["127.0.0.1:8000:8000"]
volumes:
  pgdata:
